const statusEl = document.getElementById('status');
let lastPlayingId = -1;

function frame(ts) {
  if (!lastFrame) lastFrame = ts;
  const dt = Math.min(0.1, (ts - lastFrame) / 1000);
  lastFrame = ts;
  if (playing) step(dt);
  draw();

  // status + progress bars
  if (mode === 'single') {
    statusEl.innerHTML = '<span class="st-name">' + ANIMS[selected].name + '</span><span class="st-trans">playing on its own' + (selected === 2 ? ' \u00b7 ' + fsStatus : '') + '</span>';
    if (lastPlayingId !== -2) { document.querySelectorAll('.anim-row').forEach(r => r.classList.remove('playing')); lastPlayingId = -2; }
  } else {
    const { pos, local, dur } = currentPosition();
    const id = order[pos];
    const inTransition = local >= dur - transLen(pos);
    statusEl.innerHTML = '<span class="st-name">' + (pos + 1) + '. ' + ANIMS[id].name + '</span>' +
      '<span class="st-time">' + fmtTime(local) + ' of ' + fmtTime(dur) + '</span>' +
      '<span class="st-loop">loop ' + fmtTime(seqTime) + ' of ' + fmtTime(cycleSeconds()) + '</span>' +
      '<span class="st-trans">' + (inTransition ? TRANSITION_TYPES[transitions[pos].type].name + ' into ' + ANIMS[order[(pos + 1) % order.length]].name : id === 2 ? fsStatus : '') + '</span>';
    document.querySelectorAll('.trans-row').forEach(r => r.classList.toggle('active', inTransition && r.id === 'trans-' + pos));
    if (id !== lastPlayingId) {
      document.querySelectorAll('.anim-row').forEach(r => r.classList.toggle('playing', parseInt(r.dataset.id, 10) === id));
      document.querySelectorAll('.prog-fill').forEach(p => (p.style.width = '0%'));
      lastPlayingId = id;
    }
    const bar = document.getElementById('prog-' + id);
    if (bar) bar.style.width = (local / dur * 100) + '%';
  }
  requestAnimationFrame(frame);
}

// =====================================================================
//  VERSIONS: save, load, delete, export and import named settings
//  Stored in this browser (localStorage). Export makes a file you can share.
// =====================================================================
const STORE_VERSIONS = 'manifold-versions';
const STORE_LATEST = 'manifold-latest';
const versionMsg = document.getElementById('versionMsg');
const versionList = document.getElementById('versionList');
const versionName = document.getElementById('versionName');

// Everything that makes up a version
function currentState() {
  return {
    settings: JSON.parse(JSON.stringify(settings)),
    order: order.slice(),
    transitions: transitions.map(t => ({ type: t.type, len: t.len })),
    stripLength: stripLength,
    piece: { millCm: piece.millCm, tideChanges: piece.tideChanges, month: piece.month, floodCounts: piece.floodCounts.slice(), months: MONTH_SET, brightness: piece.brightness },
    hwKey: hwKey
  };
}

// Put a saved version back, keeping sensible defaults for anything missing
function applyState(data) {
  if (!data || typeof data !== 'object') return false;
  let saved = Array.isArray(data.settings) ? data.settings : [];
  if (saved.length === 5) {        // older version: FLOODING and SEWAGE were separate, so merge them
    const fl = Object.assign({}, saved[2] || {}); delete fl.origin;
    saved = [saved[0], saved[1], Object.assign({}, saved[3] || {}, fl), saved[4]];
  }
  settings = ANIMS.map((a, id) => Object.assign(defaultSettings(id), saved[id] || {}));
  const ok = Array.isArray(data.order) && data.order.length === ANIMS.length &&
             data.order.slice().sort().every((v, k) => v === k);
  order = ok ? data.order.slice() : ANIMS.map((_, k) => k);
  if (Array.isArray(data.transitions) && data.transitions.length === ANIMS.length) {
    transitions = data.transitions.map(t => ({
      type: TRANSITION_TYPES.some(x => x.id === t.type) ? t.type : 0,
      len: TRANSITION_LENGTHS.includes(t.len) ? t.len : 5
    }));
  }
  if (data.stripLength > 0) stripLength = data.stripLength;
  piece = Object.assign(defaultPiece(), data.piece || {});
  if (piece.months !== MONTH_SET || !Array.isArray(piece.floodCounts) || piece.floodCounts.length !== 12) {
    piece.floodCounts = FLOOD_DATA.slice(); piece.month = 0; piece.months = MONTH_SET;   // older Oct 2023-Sep 2024 data: start again from January 2025
  }
  piece.month = Math.max(0, Math.min(11, Math.round(piece.month) || 0));
  tideInput.value = piece.tideChanges;
  piece.brightness = Math.max(1, Math.min(255, Math.round(piece.brightness) || 70));
  brightInput.value = piece.brightness;
  clampPositions();
  if (HARDWARE[data.hwKey]) hwKey = data.hwKey;
  N = HARDWARE[hwKey].leds;
  document.getElementById('lengthInput').value = stripLength;
  document.querySelectorAll('#hwSeg button').forEach(x => x.classList.toggle('on', x.dataset.hw === hwKey));
  effects = ANIMS.map(a => a.make());
  makeBuffers(); sizeCanvas(); buildRuler(); renderList(); renderSettings(); updateCode();
  return true;
}

function readVersions() {
  try { return JSON.parse(localStorage.getItem(STORE_VERSIONS)) || []; } catch (e) { return []; }
}
function writeVersions(list) {
  try { localStorage.setItem(STORE_VERSIONS, JSON.stringify(list)); return true; }
  catch (e) { showMsg('Couldn\u2019t save in this browser. Use Export file instead.'); return false; }
}
function rememberLatest() {
  try { localStorage.setItem(STORE_LATEST, JSON.stringify(currentState())); } catch (e) { /* not available: ignore */ }
}

let msgTimer = null;
function showMsg(text) {
  versionMsg.textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => (versionMsg.textContent = ''), 4000);
}

function refreshVersionList(selectName) {
  const list = readVersions();
  versionList.innerHTML = list.length
    ? list.map(v => '<option value="' + encodeURIComponent(v.name) + '">' + v.name.replace(/</g, '&lt;') + '</option>').join('')
    : '<option value="">No saved versions yet</option>';
  if (selectName) versionList.value = encodeURIComponent(selectName);
}
const selectedVersionName = () => decodeURIComponent(versionList.value || '');

document.getElementById('saveVersion').addEventListener('click', () => {
  const name = versionName.value.trim();
  if (!name) { showMsg('Type a name first'); versionName.focus(); return; }
  const list = readVersions();
  const existing = list.findIndex(v => v.name === name);
  const entry = { name, saved: new Date().toISOString(), data: currentState() };
  if (existing >= 0) list[existing] = entry; else list.push(entry);
  if (writeVersions(list)) {
    refreshVersionList(name);
    showMsg(existing >= 0 ? 'Updated \u201c' + name + '\u201d' : 'Saved \u201c' + name + '\u201d');
  }
});

document.getElementById('loadVersion').addEventListener('click', () => {
  const name = selectedVersionName();
  const v = readVersions().find(x => x.name === name);
  if (!v) { showMsg('Choose a saved version first'); return; }
  applyState(v.data);
  versionName.value = v.name;
  showMsg('Loaded \u201c' + v.name + '\u201d');
});

document.getElementById('deleteVersion').addEventListener('click', () => {
  const name = selectedVersionName();
  if (!name) { showMsg('Choose a saved version first'); return; }
  if (!confirm('Delete the version \u201c' + name + '\u201d?')) return;
  if (writeVersions(readVersions().filter(x => x.name !== name))) {
    refreshVersionList();
    showMsg('Deleted \u201c' + name + '\u201d');
  }
});

document.getElementById('exportVersion').addEventListener('click', () => {
  const name = versionName.value.trim() || selectedVersionName() || 'manifold-settings';
  const file = { name, saved: new Date().toISOString(), data: currentState() };
  const blob = new Blob([JSON.stringify(file, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^a-z0-9-_ ]/gi, '').trim().replace(/\s+/g, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  showMsg('Exported \u201c' + name + '\u201d');
});

const importFile = document.getElementById('importFile');
document.getElementById('importVersion').addEventListener('click', () => importFile.click());
importFile.addEventListener('change', () => {
  const f = importFile.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const file = JSON.parse(reader.result);
      const data = file.data || file;
      if (!applyState(data)) throw new Error('bad file');
      const name = (file.name || f.name.replace(/\.json$/i, '')).toString();
      const list = readVersions().filter(x => x.name !== name);
      list.push({ name, saved: new Date().toISOString(), data: currentState() });
      writeVersions(list);
      refreshVersionList(name);
      versionName.value = name;
      showMsg('Imported \u201c' + name + '\u201d');
    } catch (e) {
      showMsg('That file isn\u2019t a Manifold settings file');
    }
    importFile.value = '';
  };
  reader.readAsText(f);
});

// =====================================================================
//  START
// =====================================================================
window.addEventListener('resize', sizeCanvas);
const stickyStrip = document.querySelector('.sticky-strip');
window.addEventListener('scroll', () => stickyStrip.classList.toggle('stuck', stickyStrip.getBoundingClientRect().top <= 0 && window.scrollY > 0), { passive: true });
refreshVersionList();
let restored = false;
try {
  const latest = JSON.parse(localStorage.getItem(STORE_LATEST));
  if (latest) restored = applyState(latest);
} catch (e) { /* nothing remembered yet */ }
if (!restored) { sizeCanvas(); buildRuler(); renderList(); renderSettings(); updateCode(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
